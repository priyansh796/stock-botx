name: Run Stock Bot

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Create credentials.json
        run: echo '${{ secrets.GOOGLE_CREDS }}' > credentials.json

      - name: Run Stock Bot
        run: python stock_bot_monthly.py
